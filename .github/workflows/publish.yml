name: Build and publish learning decks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-learning-decks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build and verification tools
        run: python -m pip install -r requirements-test.txt
      - name: Build every deck
        run: python scripts/build.py
      - name: Verify with Anki
        run: python scripts/verify.py
      - name: Verify automatic sync and review preservation
        run: python scripts/verify_sync.py
      - name: Publish all decks together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="decks-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apkg dist/*.csv dist/catalog.json --clobber
            gh release edit "$tag" --notes-file dist/RELEASE.md --latest
          else
            gh release create "$tag" dist/*.apkg dist/*.csv dist/catalog.json \
              --target "$GITHUB_SHA" --title "Learning decks · build ${GITHUB_RUN_NUMBER}" \
              --notes-file dist/RELEASE.md --latest
          fi
